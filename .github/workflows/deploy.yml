name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 文章底部的 Last Updated 取「最后一次 git 提交时间」，需要完整历史；
          # 默认的 depth=1 浅克隆会让所有文章都拿不到自己的提交记录
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本以根目录 package.json 的 "packageManager": "pnpm@11.16.0" 为准，
        # 不要同时写 version，否则 action 会报 Multiple versions of pnpm specified

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: blog/pnpm-lock.yaml

      - name: Sync blog source
        run: node .scripts/sync-site.mjs

      - name: Install dependencies
        run: pnpm --dir blog install --frozen-lockfile

      - name: Build site
        run: pnpm --dir blog build

      - name: Generate sitemap
        run: node blog/script/sitemap.mjs

      - name: Add .nojekyll
        run: touch blog/site-dev/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库公开时自动开启 GitHub Pages，避免手动去 Settings 配置
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog/site-dev

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
